- id: jebo
  type: publication
  title: "The Superstar and the Followers: Intra-Firm Product Complementarity in International Trade"
  year: 2020
  coauthors: []
  venue: "Journal of Economic Behavior & Organization, 2020, 177: 277–304"
  topics: [Trade, Firm networks]
  abstract: "Export sales of multi-product firms are known to be skewed towards their best performing core products. Less is known about the large number of products outside the core that still account for a considerable share of the export value. I use high-quality Swedish firm-registry data to investigate if the exports of core and non-core products are systematically interconnected. Using a novel instrumental variable approach, I find evidence that the exports of non-core products respond to trade of the core. Conversely, the same complementarity is not found using non-core products as placebo-cores. Decomposing the response, I find that over a quarter of the effect can be attributed to price changes of non-core products, suggestive of demand-side explanations. The main contribution of this paper is identifying a new, sizeable, and systematic within-firm one-way complementarity between products that can explain non-core product trade flows. Ignoring this pattern of cross-product dependence may lead to an under-emphasis on the core and over-emphasis on individual trade flows as products should not be viewed in isolation, since the ‘superstar’ core has (contemporaneous) followers."
  links:
    - {label: "Journal", href: "https://doi.org/10.1016/j.jebo.2020.06.013"}
  bibtex: |
    @article{Arnarson2020,
      author  = {Arnarson, Bj{\"o}rn Thor},
      title   = {The Superstar and the Followers: Intra-Firm Product Complementarity in International Trade},
      journal = {Journal of Economic Behavior \& Organization},
      year    = {2020},
      volume  = {177},
      pages   = {277--304},
      doi     = {10.1016/j.jebo.2020.06.013}
    }

- id: ael
  type: publication
  title: "The Paternity Leave Act in Iceland: Implications for Gender Equality in the Labour Market"
  year: 2010
  coauthors:
    - {name: "Aparna Mitra", url: ""}
  venue: "Applied Economics Letters, 2010, 17(7): 677–680"
  topics: [Labour markets, Gender and health]
  abstract: "The Icelandic Act on Maternity/Paternity and Parental Leave (2000) introduced some major changes. The leave was extended from 6 to 9 months, and parents who were active in the labour market were paid 80% of their average salaries during the leave. The 9 months' leave was distributed so that mothers could take 3 months' leave, fathers could take 3 months' leave and the remaining 3 months could be shared by the mother or father in any manner that the parents saw fit. Using information and data from the Althingi and Statice, this article discusses the new legislation and the implications of such a policy in reducing gender inequality in the Icelandic labour market."
  links:
    - {label: "Journal", href: "https://doi.org/10.1080/13504850802297830"}
  bibtex: |
