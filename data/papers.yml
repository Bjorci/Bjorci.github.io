- id: jie
  type: publication
  title: "Globalization and the Gender Gap in Mental Well-being"
  year: 2026
  coauthors:
    - {name: "Asker Nygaard David", url: "https://researchprofiles.ku.dk/en/persons/asker-nygaard-christensen/"}
    - {name: "Beata S. Javorcik", url: "https://users.ox.ac.uk/~econ0247/"}
    - {name: "Jakob R. Munch", url: "https://sites.google.com/view/jakob-roland-munch"}
  venue: "Journal of International Economics, 2026, 161: 104253"
  tagline: "Journal of International Economics, 2026"
  featured: true
  topics: [Trade, Labour markets, Gender and health]
  abstract: "Working with business partners in distant countries often requires operating outside standard working hours, potentially harming workers’ mental well-being—especially for women balancing professional and family responsibilities. This hypothesis is investigated using matched employer-employee data from Denmark merged with information on workers’ use of prescription antidepressants (AD) and firms’ import and export transactions. The analysis exploits variation within job spells and controls for both unobservable firm-year heterogeneity and for the average differential in annual AD use among men and women. The results indicate that a decline in the business hour overlap between a Danish firm and its foreign trading partners leads to an increased AD use among women relative to men. This effect is economically meaningful, largest for college-educated workers under 45 and more pronounced for single mothers. In addition to the gender effect, workers in occupations requiring establishing relationships with others are more strongly affected than those in other occupations."
  links:
    - {label: "PDF", href: "https://drive.google.com/file/d/1Rhq3FLU0QwxFyOqgCar04nUHoR96aZMY/view?usp=drive_link"}
    - {label: "Journal", href: "https://doi.org/10.1016/j.jinteco.2026.104253"}
    - {label: "Working paper (ROCKWOOL Study Paper 196)", href: "https://en.rockwoolfonden.dk/publications/globalisation-and-the-gender-gap-in-mental-well-being/"}
    - {label: "CEPR DP19633", href: "https://cepr.org/publications/dp19633"}
  media:
    - {label: "Jyllands-Posten", href: "https://jyllands-posten.dk/erhverv/ECE16447640/job-paa-tvaers-af-tidszoner-rammer-yngre-kvinders-mentale-helbred/"}
  bibtex: |
    @article{ArnarsonDavidJavorcikMunch2026,
      author  = {Arnarson, Bj{\"o}rn Thor and David, Asker Nygaard and Javorcik, Beata Smarzynska and Munch, Jakob Roland},
