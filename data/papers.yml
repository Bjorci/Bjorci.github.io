      author      = {Arnarson, Bj{\"o}rn Thor and Munch, Jakob Roland and Olsen, Morten and Simonsen, Emil A. L.},
      title       = {Knowledge Spillovers from Cross-Border Commuters: Evidence from a Natural Experiment},
      institution = {ROCKWOOL Foundation Research Unit},
      type        = {Study Paper},
      number      = {215},
      year        = {2024}
    }

- id: rd
  type: working-paper
  title: "R&D Employment and Transmission in Trade and MNE Networks: Evidence from an R&D Tax Reform"
  year: 2024
  coauthors:
    - {name: "Magnus T. Buus", url: "https://sites.google.com/view/magnusbuus"}
    - {name: "Jakob R. Munch", url: "https://sites.google.com/view/jakob-roland-munch"}
    - {name: "Georg Schaur", url: "https://sites.google.com/site/georgschaur/home"}
  venue: "ROCKWOOL Foundation Study Paper 217, 2024"
  topics: [Øresund, Firm networks, Knowledge spillovers]
  presented: "RMET 2026 (Banff); DIW Berlin 2026"
  abstract: "We combine R&D survey data, Swedish and Danish register data, MNE group information, firm-to-firm trade linkages, and a plausibly exogenous policy shock that reduces firms’ employment related R&D expenditures to provide evidence for the allocation of R&D activities among Swedish-Danish trade and MNE partners. We first show that Swedish firms increased their R&D employment in response to the introduction of an R&D related tax deduction. We then show that the R&D tax reform leads to a fall in R&D employment among Danish MNE partners, but an increase among Danish trade partners. We conclude that R&D policies increase global research activities within trade networks, but substitution across affiliates dampens the reform’s effect on research activity within MNE networks."
  links:
    - {label: "PDF", href: "https://rockwoolfonden.s3.eu-central-1.amazonaws.com/wp-content/uploads/2024/06/RFF-Studypaper217-RD-reform-spillovers-RFF_September2024.pdf"}
    - {label: "ROCKWOOL page", href: "https://en.rockwoolfonden.dk/publications/rd-employment-and-transmission-in-trade-and-mne-networks-evidence-from-a-rd-tax-reform/"}
  bibtex: |
