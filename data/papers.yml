- id: scale
  type: working-paper
  title: "Growing Together and Apart: Scale Economies and Labor Specialization in Global Value Chains"
  year: 2026
  coauthors:
    - {name: "Magnus T. Buus", url: "https://sites.google.com/view/magnusbuus"}
    - {name: "Andreas Moxnes", url: "https://sites.google.com/site/moxnes/home"}
    - {name: "Jakob R. Munch", url: "https://sites.google.com/view/jakob-roland-munch"}
    - {name: "Chong Xiang", url: "https://sites.google.com/view/chongxiang/home"}
  status: "R&R, Journal of Political Economy"
  venue: "CESifo Working Paper 12710 · CEPR Discussion Paper 21543"
  page: papers/growing-together.html
  featured: true
  topics: [Trade, Firm networks, Labour markets]
  presented: "ETSG 2026 (Exeter)"
  abstract: "We study how firm growth reorganizes the division of labor across firms in global value chains. Using a novel dataset linking cross-border firm-to-firm transactions to matched employer–employee data, we show that demand shocks increase trade between firms while reducing occupational similarity, implying greater specialization. We develop and estimate a model of task outsourcing in which firms expand by reallocating tasks to suppliers. The model matches the data and implies endogenous scale economies. Eliminating outsourcing reduces average labor productivity by 25 percent and increases input costs by 10 percent, highlighting the central role of specialization in shaping firm performance."
  links:
    - {label: "PDF", href: "https://www.ifo.de/DocDL/cesifo1_wp12710.pdf"}
    - {label: "CESifo WP 12710", href: "https://doi.org/10.65864/rekivjv2z7"}
    - {label: "CEPR DP21543", href: "https://cepr.org/publications/dp21543"}
