      author      = {Arnarson, Bj{\"o}rn Thor},
      title       = {Bridging Trade Barriers: Evaluating Multi-Product Models of Exporting},
      institution = {Lund University, Department of Economics},
      type        = {Working Paper},
      number      = {2015:6},
      year        = {2015}
    }

