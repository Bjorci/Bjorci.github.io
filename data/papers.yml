- id: sjoe
  type: publication
  title: "Linking Local Services to Global Manufactures"
  year: 2022
  coauthors:
    - {name: "Joakim Gullstrand", url: "https://sites.google.com/site/jagullstrand/home"}
  venue: "The Scandinavian Journal of Economics, 2022, 124(1): 3–34"
  topics: [Trade, Firm networks]
  abstract: "We assess how global shocks propagate from global manufacturing firms to local service providers through a spatial variation in export‐driven service demand. We show that a 1 percent increase in a localized measure of exporting increases sales of service firms by around 0.08 percent. We also show that this link is local as the effect fades away after just 20 km, that it is more pronounced with larger and foreign‐owned service firms, and that the impact extends beyond sales as it also increases employment as well as productivity in local service plants and it also make them less likely to move."
  links:
    - {label: "Journal", href: "https://doi.org/10.1111/sjoe.12459"}
  bibtex: |
    @article{ArnarsonGullstrand2022,
      author  = {Arnarson, Bj{\"o}rn Thor and Gullstrand, Joakim},
      title   = {Linking Local Services to Global Manufactures},
      journal = {The Scandinavian Journal of Economics},
      year    = {2022},
      volume  = {124},
      number  = {1},
      pages   = {3--34},
      doi     = {10.1111/sjoe.12459}
    }

- id: sr
  type: publication
  title: "How a School Holiday Led to Persistent COVID-19 Outbreaks in Europe"
  year: 2021
  coauthors: []
  venue: "Scientific Reports, 2021, 11: 24390"
  note: "Part of the Marie Skłodowska-Curie research fellowship BRIDGE."
  topics: [Gender and health]
  abstract: "This paper investigates the role of large outbreaks on the persistence of Covid-19 over time. Using data from 650 European regions in 14 countries, I first show that winter school holidays in late February/early March 2020 (weeks 8, 9 and 10) led to large regional outbreaks of Covid-19 in the spring with the spread being 60% and up-to over 90% higher compared to regions with earlier school holidays. While the impact of these initial large outbreaks fades away over the summer months, it systematically reappears from the fall as regions with school holidays in weeks 8, 9 and 10 had 30-70% higher spread. This suggests that following a large outbreak, there is a strong element of underlying (latent) regional persistence of Covid-19. The strong degree of persistence highlights the long-term benefits of effective (initial) containment policies, as once a large outbreak has occurred, Covid-19 persists. This result emphasizes the need for vaccinations against Covid-19 in regions that have recently experienced large outbreaks but are well below herd-immunity, to avoid a new surge of cases."
  links:
    - {label: "Journal (open access)", href: "https://doi.org/10.1038/s41598-021-03927-z"}
  media:
    - {label: "Weekendavisen", href: "https://www.weekendavisen.dk/2021-8/ideer/rejsefeber"}
    - {label: "Weekendavisen (PDF)", href: "https://alumni-my.sharepoint.com/:b:/g/personal/vpd239_ku_dk/EQxXGKzULJtLomv58txpdX8B7qsd5W8jMGzyoQS-icSPIw?e=jw1CFW"}
    - {label: "University of Copenhagen news", href: "https://www.econ.ku.dk/Nyheder/Alle_nyheder/how-a-holiday-affected-the-spread-of-covid-19-in-europe/"}
    - {label: "Thread on X", href: "https://twitter.com/bjorci/status/1358696102929850369"}
  bibtex: |
    @article{Arnarson2021,
      author  = {Arnarson, Bj{\"o}rn Thor},
      title   = {How a School Holiday Led to Persistent {COVID-19} Outbreaks in {Europe}},
      journal = {Scientific Reports},
